aid: 908-devices
name: 908 Devices
description: >-
  908 Devices Inc. (Nasdaq: MASS) is a Burlington, Massachusetts maker of purpose-built handheld
  chemical analysis devices for public safety, defense, customs and forensic teams. Its flagship
  MX908 is a handheld high-pressure mass spectrometer that identifies narcotics, explosives and
  hazardous materials at trace level in about 30 seconds; the portfolio also includes the VipIR,
  XplorIR, ProtectIR and InterceptIR FTIR/Raman analyzers and, since the May 2026 acquisition of
  NIRLAB AG of Lausanne, a cloud-connected NIR spectroscopy platform. As of this profile the
  company publishes no public developer program, API reference, OpenAPI or SDK: MX908 integration
  ships as an RS232 serial port, field data moves over Bluetooth via the MX908 Remote and Team
  Leader mobile apps, and the NIRLAB cloud console at app.nirlab.com is login-gated. NIRLAB's
  FIELDLAB is marketed to app developers, but its reference sits behind a contact-sales form.
